name: Build FFI Binaries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-24.04
            artifact: linux-x64
            output: build/lib_coacd.so
          - os: macos-15
            artifact: macos-arm64
            output: build/lib_coacd.dylib
          - os: windows-2025
            artifact: windows-x64
            output: build/Release/lib_coacd.dll

    name: Build ${{ matrix.config.artifact }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install macOS dependencies
        if: matrix.config.os == 'macos-15'
        run: brew install libomp

      - name: Configure CMake
        shell: bash
        run: |
          CMAKE_ARGS=(
            -S . -B build
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
            -DBUILD_SHARED_LIBS=OFF
            -DOPENVDB_CORE_SHARED=OFF
            -DTBB_TEST=OFF
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          )
          if [ "${{ matrix.config.os }}" = "macos-15" ]; then
            LIBOMP=$(brew --prefix libomp)
            CMAKE_ARGS+=(
              "-DOpenMP_C_FLAGS=-Xclang -fopenmp -I${LIBOMP}/include"
              "-DOpenMP_CXX_FLAGS=-Xclang -fopenmp -I${LIBOMP}/include"
              "-DOpenMP_C_LIB_NAMES=omp"
              "-DOpenMP_CXX_LIB_NAMES=omp"
              "-DOpenMP_omp_LIBRARY=${LIBOMP}/lib/libomp.dylib"
            )
          fi
          cmake "${CMAKE_ARGS[@]}" 2>&1 | tee cmake-configure.log

      - name: Verify CMake found OpenMP
        shell: bash
        run: |
          if grep -q "Found OpenMP" cmake-configure.log; then
            echo "OK - CMake detected OpenMP:"
            grep "Found OpenMP" cmake-configure.log
          else
            echo "::error::OpenMP not detected by CMake"
            exit 1
          fi

      - name: Build _coacd
        run: cmake --build build --target _coacd --config Release --parallel 4

      - name: List outputs
        shell: bash
        run: find build -name "lib_coacd*" -type f

      - name: Verify OpenMP linkage (Linux)
        if: matrix.config.os == 'ubuntu-24.04'
        run: |
          echo "=== ldd output ==="
          ldd build/lib_coacd.so
          echo "=== checking libgomp ==="
          ldd build/lib_coacd.so | grep -q libgomp || { echo "::error::libgomp not linked"; exit 1; }
          echo "OK - libgomp linked"

      - name: Verify OpenMP linkage (macOS)
        if: matrix.config.os == 'macos-15'
        run: |
          echo "=== otool -L output ==="
          otool -L build/lib_coacd.dylib
          echo "=== checking libomp ==="
          otool -L build/lib_coacd.dylib | grep -q libomp || { echo "::error::libomp not linked"; exit 1; }
          echo "OK - libomp linked"

      - name: Verify OpenMP linkage (Windows)
        if: matrix.config.os == 'windows-2025'
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("build\Release\lib_coacd.dll")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -match "VCOMP140\.DLL") {
            Write-Host "OK - VCOMP140.DLL referenced (OpenMP linked)"
          } else {
            Write-Host "::error::VCOMP140.DLL not found in DLL imports"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lib_coacd-${{ matrix.config.artifact }}
          path: ${{ matrix.config.output }}
